<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:"SG";src:url(fonts/sg.woff) format("woff");font-weight:300 800}
@font-face{font-family:"IN";src:url(fonts/in.woff) format("woff");font-weight:300 800}
@font-face{font-family:"JB";src:url(fonts/jb.woff) format("woff");font-weight:300 800}
:root{--gold:#f5b83d;--gold2:#ffdc8e;--ink:#f4efe4;--ink2:#b9b1a2;--ink3:#7d766a;--good:#3cc995;--m:#c79316;--ten:#5b98ea;--gui:#e0603f;--pet:#22a892}
*{box-sizing:border-box}
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:transparent;font-family:IN,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.stage{position:absolute;inset:0;overflow:hidden}
.dark{background:radial-gradient(ellipse at 50% 42%,#1b1710 0%,#0a0b0d 64%)}
.abs{position:absolute}
.k{font:600 24px/1 JB,monospace;letter-spacing:.18em;color:var(--gold);text-transform:uppercase}
.gold{color:var(--gold)}
/* caption: one line or two, big enough for a phone */
#cap{position:absolute;left:50%;bottom:0;transform:translateX(-50%);display:inline-block;max-width:1560px;
  background:rgba(14,12,9,.9);border:1.5px solid rgba(245,184,61,.32);border-radius:22px;padding:22px 44px 24px;
  box-shadow:0 18px 50px rgba(0,0,0,.35);color:#fff;text-align:center}
#cap .txt{font:500 42px/1.28 IN;letter-spacing:-.012em;text-wrap:balance}
#cap .txt b{color:#ffc552;font-weight:700}
.chip{display:inline-flex;align-items:center;gap:14px;padding:14px 26px;border-radius:999px;background:rgba(14,12,9,.88);border:1.5px solid rgba(245,184,61,.45);
  font:600 30px SG;color:var(--ink);letter-spacing:-.01em;box-shadow:0 14px 40px rgba(0,0,0,.35)}
.pdot{width:18px;height:18px;border-radius:50%;background:#4a3f2a}
.pdot.on{background:var(--gold);box-shadow:0 0 0 7px rgba(245,184,61,.2)}
</style></head>
<body>
<svg width="0" height="0" style="position:absolute"><defs><linearGradient id="gb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd27a"/><stop offset=".55" stop-color="#f5b83d"/><stop offset="1" stop-color="#c98d0c"/></linearGradient></defs></svg>
<div id="root" class="stage"></div>
<script>
const R = document.getElementById('root');
const cl = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ez = p => 1 - Math.pow(1 - cl(p), 3);
const back = p => { p = cl(p); const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); };
const seg = (t, a, b) => cl((t - a) / (b - a));
const words = (txt, t, t0, step, cls = '') => txt.split(' ').map((w, i) => { const p = ez(seg(t, t0 + i * step, t0 + i * step + .35));
  return `<span class="${cls}" style="display:inline-block;opacity:${p};transform:translateY(${(1 - p) * 34}px);margin:0 .13em">${w}</span>`; }).join('');
function mark(size = 120) {
  return `<svg width="${size}" height="${size * 26 / 30}" viewBox="9 11 30 26"><path d="M14 13h20l3.2 8.6H10.8z" fill="url(#gb)" stroke="#f5b83d" stroke-width="1.6" stroke-linejoin="round"/><path d="M14 26.4h20l3.2 8.6H10.8z" fill="url(#gb)" stroke="#f5b83d" stroke-width="1.6" stroke-linejoin="round"/></svg>`;
}
let V = {};                                  // values from dashboard/data.json, set by the renderer

window.caption = html => {
  R.className = 'stage'; document.body.style.background = 'transparent';
  R.innerHTML = `<div id="cap"><div class="txt">${html.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')}</div></div>`;
  const r = document.getElementById('cap').getBoundingClientRect(); return [r.left, r.top, r.width, r.height];
};

/* "Your guess?": three dots fill while the viewer thinks */
window.predict = (t, dur) => {
  R.className = 'stage'; document.body.style.background = 'transparent';
  const a = ez(seg(t, 0, .25)) * (1 - seg(t, dur - .2, dur));
  const n = Math.min(3, Math.floor(t / (dur / 3.2)));
  R.innerHTML = `<div class="abs" style="left:0;right:0;top:${70 - 20 * (1 - a)}px;text-align:center;opacity:${a}">
    <span class="chip"><span style="color:var(--gold)">Your guess?</span>${[0, 1, 2].map(i => `<span class="pdot ${i < n ? 'on' : ''}"></span>`).join('')}</span></div>`;
};

const BEAT = {
  black: t => '',
  same: t => {
    let h = `<div class="abs" style="left:0;right:0;top:300px;text-align:center;font:600 98px/1.05 SG;letter-spacing:-.045em;color:var(--ink)">${words('Same gold.', t, .05, .12)}</div>`;
    h += `<div class="abs" style="left:0;right:0;top:420px;text-align:center;font:600 98px/1.05 SG;letter-spacing:-.045em;color:var(--gold)">${words('Four contracts. Four prices.', t, .45, .12)}</div>`;
    const C = [['GOLDM', '100 g · 995', '--m'], ['GOLDTEN', '10 g · 999', '--ten'], ['GOLDGUINEA', '8 g coin · 999', '--gui'], ['GOLDPETAL', '1 g · 999', '--pet']];
    h += `<div class="abs" style="left:0;right:0;top:640px;display:flex;justify-content:center;gap:26px">` + C.map(([n, d, c], i) => { const p = back(seg(t, 1.05 + i * .12, 1.5 + i * .12));
      return `<div style="opacity:${cl(p)};transform:translateY(${(1 - p) * 40}px);padding:20px 28px;border-radius:20px;background:#16130d;border:1.5px solid #3a3222;min-width:300px;text-align:left">
        <div style="display:flex;align-items:center;gap:12px"><i style="width:14px;height:14px;border-radius:50%;background:var(${c});display:block"></i><span style="font:600 32px SG;color:var(--ink)">${n}</span></div>
        <div style="font:500 22px JB;color:var(--ink2);margin-top:8px">${d}</div></div>`; }).join('') + '</div>';
    return h;
  },
  toogood: t => {
    const a = ez(seg(t, .05, .5));
    let h = `<div class="abs" style="left:0;right:0;top:${330 - 20 * (1 - a)}px;text-align:center;opacity:${a}"><span class="k">${V.net} · on data the rules never saw</span></div>`;
    const q = ez(seg(t, 1.0, 1.45)), mark = back(seg(t, 2.45, 2.85));
    h += `<div class="abs" style="left:0;right:0;top:430px;text-align:center;font:700 150px/1 SG;letter-spacing:-.055em;color:var(--ink);opacity:${q};transform:scale(${.94 + .06 * q})">
      Too good to be true<span style="display:inline-block;color:var(--gold);opacity:${cl(mark)};transform:scale(${.4 + .6 * mark}) rotate(${(1 - mark) * -20}deg)">?</span></div>`;
    return h;
  },
  tomorrow: t => {
    let h = `<div class="abs" style="left:0;right:0;top:340px;text-align:center;font:600 112px/1.05 SG;letter-spacing:-.045em;color:var(--ink)">${words("Tomorrow's answer", t, .1, .14)}</div>`;
    h += `<div class="abs" style="left:0;right:0;top:480px;text-align:center;font:600 112px/1.05 SG;letter-spacing:-.045em;color:var(--gold)">${words("isn't in this video.", t, .55, .14)}</div>`;
    const s = ez(seg(t, 1.6, 2.1));
    h += `<div class="abs" style="left:0;right:0;top:680px;text-align:center;opacity:${s}"><span style="font:500 30px IN;color:var(--ink2)">This video stops at ${V.last}. The site doesn't.</span></div>`;
    return h;
  },
  end: t => {
    const a = ez(seg(t, .05, .6)), b = ez(seg(t, .45, 1.0)), c = ez(seg(t, .9, 1.4));
    const pulse = .55 + .45 * Math.sin(t * 5);
    let h = `<div class="abs" style="left:200px;top:${230 + 30 * (1 - a)}px;opacity:${a};display:flex;align-items:center;gap:26px">${mark(96)}<span style="font:700 112px/1 SG;letter-spacing:-.055em;color:var(--ink)">Parity</span></div>`;
    h += `<div class="abs" style="left:200px;top:${420 + 20 * (1 - b)}px;opacity:${b}">
      <div style="display:flex;align-items:center;gap:18px"><span style="display:inline-flex;align-items:center;gap:10px;padding:8px 16px;border-radius:99px;background:rgba(46,204,138,.14);color:#4fe0a2;font:700 24px SG;letter-spacing:.08em">
        <i style="width:12px;height:12px;border-radius:50%;background:#4fe0a2;display:block;opacity:${pulse}"></i>LIVE</span>
        <span style="font:500 30px IN;color:var(--ink2)">See today's answer:</span></div>
      <div style="font:700 72px SG;letter-spacing:-.03em;color:var(--gold);margin-top:18px">parity-gold-site.vercel.app</div></div>`;
    h += `<div class="abs" style="left:200px;top:${700 + 20 * (1 - c)}px;opacity:${c}">
      <div style="font:600 30px SG;color:var(--ink)">SYNTAX TERROR (TAN) · Nikhil Kumar · Sai Ganesh · Ishaan Chhabra</div>
      <div style="font:400 24px IN;color:var(--ink3);margin-top:12px">Hack in Hills ’26 · Problem 03 · Official MCX data, ${V.tests} automated tests</div></div>`;
    h += `<div class="abs" style="left:1420px;top:${300 + 20 * (1 - b)}px;opacity:${b};text-align:center"><div style="background:#fff;padding:18px;border-radius:22px"><img src="${V.qr}" width="300" height="300" style="display:block;image-rendering:pixelated"></div>
      <div style="font:400 22px IN;color:var(--ink2);margin-top:16px">Scan to open it</div></div>`;
    return h;
  }
};
window.beat = (name, t) => { R.className = 'stage dark'; document.body.style.background = '#0a0b0d'; R.innerHTML = BEAT[name](t); };
</script></body></html>
