# Runs the full test suite on every push and pull request, on GitHub's own servers (no MCX access needed:
# the tests read the committed data and results). The daily data job runs the same suite on the team
# computer before it is allowed to publish.
name: Tests

on:
  push:
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: commodity
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # full history: test_protocol.py reads when each frozen file was committed
      - uses: actions/setup-node@v4
        with:
          node-version: "20"    # test_site_format.py runs the site's formatting code
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: commodity/tools/requirements.txt
      - name: Install
        run: pip install -q -r tools/requirements.txt scipy
      - name: Run the tests
        run: python -m unittest discover -s tests -v 2>&1 | tee test-output.txt | tail -n 40
      - name: Summary
        if: always()
        run: |
          {
            echo "### Parity test suite"
            grep -E "^Ran |^OK|^FAILED" test-output.txt || true
          } >> "$GITHUB_STEP_SUMMARY"
          grep -q "^OK" test-output.txt
