# Unattended daily data update for Parity.
# Every trading day, after MCX publishes the Bhavcopy, this fetches the gold futures still trading,
# checks them (commodity/tools/daily_update.py), rebuilds the site and commits. Vercel and Render
# redeploy from main on every push, so the live site updates with no person involved.
#
# Where it runs: MCX's firewall answers 403 "Access Denied" to cloud data centres (tested 5 Oct 2026 from
# GitHub's US runners and from Vercel's Mumbai region), so the job runs on a team computer registered as a
# self-hosted runner with the label parity-mcx (commodity/tools/RUNNER_SETUP.md). If that computer is
# asleep at the scheduled time, GitHub keeps the job queued and it runs as soon as the computer is back.
name: Daily MCX data update

on:
  schedule:
    - cron: "0 22 * * 1-5"    # 03:30 IST Tue-Sat, after the previous evening's session
    - cron: "30 2 * * 2-6"    # 08:00 IST Tue-Sat, retry in case MCX published late
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: [self-hosted, parity-mcx]
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: commodity
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: commodity/tools/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: |
          pip install -r tools/requirements.txt
          npm install --no-save --prefix tools playwright@1.48.2
          npx --prefix tools playwright install chromium
      - name: Fetch, check and rebuild
        id: upd
        env:
          NODE_PATH: ${{ github.workspace }}/commodity/tools/node_modules
          PARITY_CHROME: ${{ vars.PARITY_CHROME }}
        run: python tools/daily_update.py
      - name: Tests
        run: python -m unittest discover -s tests -q
      - name: Commit and push
        run: |
          git config user.name "parity-data-bot"
          git config user.email "parity-data-bot@users.noreply.github.com"
          git add -A raw_clean clean results dashboard/data.json dashboard/index.html dashboard/artifact.html
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "Daily data: MCX Bhavcopy through ${{ steps.upd.outputs.through }} (+${{ steps.upd.outputs.new_rows }} rows)"
          git push origin HEAD:main
