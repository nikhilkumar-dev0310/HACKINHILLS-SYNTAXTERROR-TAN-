# Unattended daily data update for Parity.
# Every trading day, after MCX publishes the Bhavcopy, this fetches the gold futures still trading,
# checks them (commodity/tools/daily_update.py), rebuilds the site and commits. Vercel and Render
# redeploy from main on every push, so the live site updates with no person involved.
#
# Where it runs: MCX's firewall answers 403 "Access Denied" to cloud data centres (tested 5 Oct 2026 from
# GitHub's US runners and from Vercel's Mumbai region), so the job runs on a team computer registered as a
# self-hosted runner with the label parity-mcx (commodity/tools/RUNNER_SETUP.md). If that computer is
# asleep at the scheduled time, GitHub keeps the job queued and it runs as soon as the computer is back.
name: Daily MCX data update

on:
  schedule:
    - cron: "0 22 * * 1-5"    # 03:30 IST Tue-Sat, after the previous evening's session
    - cron: "30 2 * * 2-6"    # 08:00 IST Tue-Sat, retry in case MCX published late
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: [self-hosted, parity-mcx]
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: commodity
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0      # full history, so the protocol tests can read when each frozen file was committed
      # The team computer's own Python and Node are used. setup-python/setup-node would try to install
      # system packages with sudo, which an unattended job cannot do.
      - name: Python and Node from this computer
        run: |
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          echo "/usr/local/bin" >> "$GITHUB_PATH"
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          # Prefer a stable Python the pinned packages ship wheels for; a beta (e.g. 3.15) would have to compile them.
          PY=""
          for c in python3.12 python3.11 python3.13 python3.10; do if command -v "$c" >/dev/null; then PY="$c"; break; fi; done
          [ -n "$PY" ] || { echo "No Python 3.10-3.13 found. Run: brew install python@3.12"; exit 1; }
          "$PY" --version && node --version && git --version
          # Reuse the job's own virtual environment between runs; rebuild it only if the Python version changed.
          V="$HOME/.parity-venv"
          if [ ! -x "$V/bin/python" ] || [ "$("$V/bin/python" -V)" != "$("$PY" -V)" ]; then rm -rf "$V"; "$PY" -m venv "$V"; fi
          echo "$HOME/.parity-venv/bin" >> "$GITHUB_PATH"
      - name: Install
        run: |
          pip install -q --disable-pip-version-check -r tools/requirements.txt
          [ -d tools/node_modules/playwright ] || npm install --no-save --no-audit --no-fund --prefix tools playwright@1.48.2
          # The computer's own Google Chrome is used, so Playwright's bundled browser is only fetched when asked for.
          if [ "${{ vars.PARITY_CHROME || 'chrome' }}" = "chromium" ]; then npx --prefix tools playwright install chromium; fi
      - name: Fetch, check and rebuild
        id: upd
        env:
          NODE_PATH: ${{ github.workspace }}/commodity/tools/node_modules
          PARITY_CHROME: ${{ vars.PARITY_CHROME || 'chrome' }}
        # Low priority, so the job never slows down whatever else the computer is doing.
        run: nice -n 10 python tools/daily_update.py
      - name: Tests
        # Runs the full suite and records the result for the site's Data quality page; a failure stops the publish.
        # Skipped when MCX had nothing new: re-running would only refresh the report's timestamp and make an empty commit.
        if: steps.upd.outputs.updated == 'true'
        run: |
          python tools/run_tests.py
          python dashboard/export.py
          python dashboard/build.py
          python dashboard/intro/gen.py > /dev/null
      - name: Commit and push
        if: steps.upd.outputs.updated == 'true'
        run: |
          git config user.name "parity-data-bot"
          git config user.email "parity-data-bot@users.noreply.github.com"
          git add -A raw_clean clean results dashboard/data.json dashboard/index.html dashboard/artifact.html dashboard/intro/index.html
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "Daily data: MCX Bhavcopy through ${{ steps.upd.outputs.through }} (+${{ steps.upd.outputs.new_rows }} rows)"
          git pull --rebase origin main
          git push origin HEAD:main
